[package]
name = "utility"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Shared generics and macros for the Philis crates"
license = "MIT"

[lib]
name = "utility"
# Plain Rust library only — these are generics/macros consumed at compile time
# by the other crates, never built as a cdylib or executable.
crate-type = ["rlib"]

[dependencies]
