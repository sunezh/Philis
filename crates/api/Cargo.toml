[package]
name = "api"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Analog place & route engine"
license = "MIT"

[lib]
name = "philis"
crate-type = ["rlib", "cdylib"]

[[bin]]
# The standalone Rust executable that `bench/` benchmarks.
name = "philis"
path = "src/main.rs"

# Integration tests live in `test/` (not the default `tests/`) and are listed
# explicitly. Each file exercises one slice of the public surface; together they
# touch every public function — see `STUBS.md` for what is real vs. stubbed.
[[test]]
name = "integration"
path = "test/integration.rs"

[[test]]
name = "api_smoke"
path = "test/api_smoke.rs"

[[test]]
name = "builder_api"
path = "test/builder_api.rs"

[[test]]
name = "units_ports"
path = "test/units_ports.rs"

[[test]]
name = "constraints_axis"
path = "test/constraints_axis.rs"

[[test]]
name = "layout_results"
path = "test/layout_results.rs"

[[test]]
name = "verify_io"
path = "test/verify_io.rs"

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", optional = true, features = ["abi3-py39"] }
